<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Danfor Elite</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #121212; /* Dark theme background */
            color: #ffffff;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        h1 {
            color: #FFD700; /* Yellow to match your academic theme */
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1rem;
            color: #bbbbbb;
        }
        .btn {
            margin-top: 25px;
            padding: 10px 25px;
            background-color: #FFD700;
            color: #000;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📖</div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection.</p>
        <p>Don't worry, your Academic Todo App will be back as soon as you're reconnected.</p>
        <br>
        <a href="javascript:window.location.reload();" class="btn">Try Again</a>
    </div>
</body>
</html>
