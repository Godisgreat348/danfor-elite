<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DANFOR ELITE</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="dark-theme">
    <div id="login-screen" class="portal-overlay">
        <div id="view-role-selection">
            <button onclick="switchView('student')">STUDENT</button>
            <button onclick="switchView('mentor')">MENTOR</button>
        </div>
        <div id="view-student-login" class="hidden">
            <input type="email" id="auth-email">
            <input type="password" id="auth-password">
            <button id="btn-login">LOGIN</button>
            <button id="btn-signup">SIGNUP</button>
            <p id="auth-error"></p>
        </div>
        <div id="view-mentor-login" class="hidden">
            <input type="text" id="target-student-id" placeholder="Student ID">
            <button onclick="connectToStudent()">CONNECT</button>
        </div>
    </div>

    <div id="dashboard">
        <h1 id="ai-greeting">Welcome</h1>
        <p id="ai-message">System Ready</p>
        <h2 id="streak-count">0 Days</h2>
        <canvas id="performanceChart"></canvas>
        <button id="logout-btn">LOGOUT</button>
        <input type="text" id="new-task-input">
        <select id="task-priority"><option value="high">High</option></select>
        <button id="add-task-btn">ADD</button>
        <ul id="task-list"></ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
