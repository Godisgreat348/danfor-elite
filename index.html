<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DanFor Elite | Academic Workspace</title>
    <link rel="manifest" href="/danfor-elite/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <meta name="description" content="DanFor Elite: The premium PWA for tracking study streaks, focus tasks, and elite performance.">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="dark-theme">
    <div id="login-screen" class="auth-container">
        <div id="view-role-selection" class="auth-box" style="text-align: center;">
            <h1 style="color: var(--accent-gold); margin-bottom: 5px;">DanFor Elite</h1>
            <p style="color: #888; margin-bottom: 30px; font-size: 0.9rem;">Select your portal to continue</p>
            <button onclick="switchView('student')" class="primary-btn" style="width: 100%; margin-bottom: 15px; padding: 15px; font-size: 1.1rem; display: flex; justify-content: center; align-items: center; gap: 10px;">
                <i class="fas fa-user-graduate"></i> Student Portal
            </button>
            <button onclick="switchView('mentor')" class="secondary-btn" style="width: 100%; padding: 15px; font-size: 1.1rem; display: flex; justify-content: center; align-items: center; gap: 10px;">
                <i class="fas fa-user-tie"></i> Mentor Portal
            </button>
        </div>

        <div id="view-student-login" class="auth-box" style="display: none;">
            <button onclick="switchView('roles')" style="background: none; border: none; color: var(--accent-gold); margin-bottom: 20px; font-size: 1rem; cursor: pointer;">
                <i class="fas fa-arrow-left"></i> Back
            </button>
            <h2 style="color: white; margin-bottom: 20px;">Student Access</h2>
            <input type="email" id="auth-email" placeholder="Student Email Address">
            <input type="password" id="auth-password" placeholder="Password">
            <div class="auth-buttons">
                <button id="btn-login" class="primary-btn">Login</button>
                <button id="btn-signup" class="secondary-btn">Sign Up</button>
            </div>
            <p id="auth-error" style="color: #ff4c4c; margin-top: 15px; font-size: 0.85rem; display: none;"></p>
        </div>
    </div>

    <div class="app-container" id="main-app-content" style="display:none;">
        <nav class="sidebar">
            <div class="brand">
                <h2>DanFor Elite</h2>
                <span class="version">v2.0 PWA</span>
            </div>
            <ul class="nav-links">
                <li class="active" data-target="dashboard"><i class="fas fa-chart-line"></i> Dashboard</li>
                <li data-target="tasks"><i class="fas fa-tasks"></i> Focus Tasks</li>
                <li data-target="gpa"><i class="fas fa-calculator"></i> GPA Estimator</li>
                <li data-target="mistakes"><i class="fas fa-book-dead"></i> Mistake Log</li>
            </ul>
            <div class="sidebar-footer">
                <button id="theme-toggle" class="btn-secondary"><i class="fas fa-moon"></i> Theme</button>
                <button id="export-btn" class="btn-primary"><i class="fas fa-file-pdf"></i> Export Data</button>
            </div>
        </nav>

        <main class="main-content">
            <button id="logout-btn" style="position: absolute; top: 20px; right: 20px; background: transparent; border: 1px solid #ff4c4c; color: #ff4c4c; padding: 5px 12px; border-radius: 5px; font-size: 0.8rem; cursor: pointer; z-index: 100;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
            
            <section id="dashboard" class="view-section active animate-fade-in">
                <header class="view-header">
                    <h1 id="ai-greeting">Good Day.</h1>
                    <div class="ai-score-card">
                        <span class="score-label">Performance</span>
                        <span class="score-value" id="ai-score">0%</span>
                    </div>
                </header>
                <div class="stats-grid">
                    <div class="stat-card glass">
                        <i class="fas fa-fire streak-icon"></i>
                        <div class="stat-info"><h3>Streak</h3><p id="streak-count">0 Days</p></div>
                    </div>
                    <div class="stat-card glass">
                        <i class="fas fa-check-circle task-icon"></i>
                        <div class="stat-info"><h3>Tasks</h3><p id="tasks-completed">0</p></div>
                    </div>
                </div>
                <div class="chart-container glass mt-2">
                    <canvas id="performanceChart"></canvas>
                </div>
            </section>

            <section id="tasks" class="view-section hidden">
                <div class="task-input-area glass">
                    <input type="text" id="new-task-input" placeholder="Task name...">
                    <button id="add-task-btn" class="btn-primary"><i class="fas fa-plus"></i></button>
                </div>
                <ul id="task-list" class="task-list mt-2"></ul>
            </section>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
    
    <script>
        // PWA REGISTRATION
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./pwabuilder-sw.js')
                .then(reg => console.log('SW Registered'))
                .catch(err => console.log('SW Error:', err));
            });
        }
    </script>
                        </body>
                                    
</html>
